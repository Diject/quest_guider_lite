maxPositionNumberToNotTrackEntrances: "Лимит для отслеживания входов"
maxPositionNumberToNotTrackEntrancesDescription: "Устанавливает максимальное количество отслеживаемых объектов, при котором маркеры для уличных объектов скрываются. Если количество отслеживаемых объектов превышает это значение, маркеры для объектов на улице не будут отображаться, чтобы избежать загромождения. Маркеры внутри помещений всегда будут отображаться. Примечание: значения больше ~50-500 считаются неограниченными из-за того, как мод учитывает отслеживаемые объекты."
