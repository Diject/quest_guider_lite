ssqnIcons: "Использовать SSQN иконки"
ssqnIconsDescription: "Если включено, перед названием квеста в списке будет отображаться иконка из Skyrim Style Quest Notifications."
questGivers: "Маркеры квестодателей"
questGiversDescription: "Создавать маркеры для квестодателей. Маркеры будут созданы как для самих квестодателей, так и для дверей в локации, где могут находиться квестодатели. Изменение этой настройки вступит в силу только после повторного входа в локацию."
textHeightMul: "Множитель текста"
textHeightMulDescription: |-
  Эта константа используется для оценки высоты текстовых элементов на основе их размера шрифта. OpenMW не предоставляет способ получить фактический размер текстовых элементов, поэтому приблизительная высота вычисляется с использованием этого множителя.
  Меньшие значения могут привести к обрезке текста. Большие значения могут привести к чрезмерным промежуткам между элементами интерфейса.
