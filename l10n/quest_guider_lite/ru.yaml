autoTrackOneEntryDialogues: "Не отслеживать квесты с одной записью"
autoTrackOneEntryDialoguesDescription: "Разрешить автоматическое отслеживание квестов, содержащих только одну запись в журнале. Эта опция помогает избежать захламления списка отслеживаемых объектов побочными ветвями, которые часто имеют только одну запись."
removeAllGroup: "Удалить"
