maxPositionNumberToNotTrackEntrances: "Object tracking limit for outdoors"
maxPositionNumberToNotTrackEntrancesDescription: "Sets the maximum number of tracked objects allowed before exterior (outdoor) markers are hidden. If the number of tracked objects exceeds this value, markers for objects in exteriors will not be shown to avoid clutter. Markers inside interiors will always be displayed. Note: Values more than ~50-500 are treated as unlimited due to how the mod counts tracked objects."
autoTrack: "Auto track objects"
autoTrackDescription: "Automatically track quest objects"
trackDisabled: "Track disabled quests"
trackDisabledDescription: "Allow to track disabled from the journal menu quests."
markerActivationDistance: "Marker Activation Distance"
markerActivationDistanceDescription: "Sets the distance at which markers for tracked objects become visible. Applies only to newly created markers. In meters."
questGiverMarkerActivationDistance: "Marker Activation Distance for quest givers"
questGiverMarkerActivationDistanceDescription: "Sets the distance at which markers for quest givers become visible. Applies only to newly created markers. In meters."
useColoredMarkers: "Colored markers"
useColoredMarkersDescription: "When enabled, each tracked object is assigned a random color to help distinguish between them. Applies only to newly created."
useColoredMarkersDescriptionInitMenu: "Assign random colors to tracked objects to help distinguish between them."
colorFlags: "Display color flags in quest list"
colorFlagsDescription: "When enabled, colored flags appear before each quest name in the menu, matching the colors of the quest's tracked objects."
overrideJournal: "Override Journal"
overrideJournalDescription: "When enabled, the mod will override the default journal menu. Requires restart."
hudMarkersEnabled: "Enable HUD markers"
hudMarkersEnabledDescription: "Requires HUDMarkers by OwnlyMe. Applies only to newly created markers."
hudMarkersRange: "HUD marker range"
hudMarkersRangeDescription: "Distance to the object in meters when HUD markers become visible."
hudMarkersRayTracing: "Hide HUD markers behind obstacles"
hudMarkersRayTracingDescription: "Uses ray tracing and may slightly reduce performance."
hudMarkersOpacity: "HUD marker opacity"
hudMarkersOpacityDescription: "In %."
autoTrackSideBranches: "Auto track side branches"
autoTrackSideBranchesDescription: "Allow automatic tracking of side branches in quests."
autoTrackOneEntryDialogues: "Auto track single-entry quests"
autoTrackOneEntryDialoguesDescription: "Allow automatic tracking of quests that contain only one journal entry. This option helps avoid cluttering the tracked objects list with side branches that often have just a single entry."
removeAllGroup: "Remove"
removeAllMarkers: "Remove all markers"
removeAllMarkersDescription: "Set to \"Yes\" to remove all tracking markers from tracked objects."
ssqnIcons: "Use SSQN icons"
ssqnIconsDescription: "If enabled, a quest icon from Skyrim Style Quest Notifications will be displayed before the quest name in the list."
questGivers: "Quest giver markers"
questGiversDescription: "Create markers for quest givers. Markers will be created both for the quest givers themselves and for doors to locations where quest givers may be found. Changing this setting will only take effect after re-entering the location."
textHeightMul: "Text height multiplier"
textHeightMulDescription: |-
  This constant is used to estimate the height of text elements based on their font size. OpenMW does not provide a way to retrieve the actual size of text elements, so an approximate height is calculated using this multiplier.
  Lower values may cause text to be clipped. Higher values can result in excessive spacing between UI components.
mouseScrollAmount: "Mouse scroll amount"
mouseScrollAmountDescription: "The amount of scrolling that occurs when using the mouse wheel. In pixels."
linkColor: "Link color"
linkColorDescription: "Color for topic names in the quest text. Default is \"707ecf\""
objectColor: "Object color"
objectColorDescription: "Color for objects in the quest text. Default is \"33e599\""
disableQuestData: "Disable quest data"
disableQuestDataDescription: "If enabled, quest data will not be loaded when the game starts. If quest data was already loaded, changes will take effect only after restarting the game."
headerBackgroundAlpha: "Header opacity"
headerBackgroundAlphaDescription: "Opacity of the header background for all menus. In %."
maxTopicEntriesPerLoadInTopicMenu: "Entries per load in Topic menu"
maxTopicEntriesPerLoadInTopicMenuDescription: "Specifies the number of latest entries loaded at a time in the topic menu"
maxTopicEntriesInJournal: "Max topic entries in journal"
maxTopicEntriesInJournalDescription: "Sets the maximum number of entries displayed for each topic in the journal. If a topic has more entries than this limit, only the most recent entries will be shown."
useForHUDMarkersDescription: "Use HUDMarkers for:\n(Applies only to newly created markers.)"
questGiversLabel: "quest givers"
