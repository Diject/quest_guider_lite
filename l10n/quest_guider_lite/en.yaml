advWMapMarkerSizeOnWorldMap: "Advanced World Map world marker size"
advWMapMarkerSizeOnWorldMapDescription: "Size of markers on the world map of the Advanced World Map mod. In pixels. Applies only to newly created markers."
mapByDefault: "Show map by default"
mapByDefaultDescription: "If enabled, the map will be displayed by default when opening the object tracking menu."
markerVisibilityKey: "Toggle marker visibility key"
markerVisibilityKeyDescription: "Sets the key used to toggle the visibility of all markers added by the mod."
enableShiftJournalMarkersToggle: "Enable Shift+Journal marker toggle"
enableShiftJournalMarkersToggleDescription: "Lets you toggle all mod markers by using Shift + the mod journal key."
firstInitMenu: "Tracking preferences menu on run"
firstInitMenuDescription: "If enabled, the tracking preferences menu will appear when the main mod window is run. This menu lets you choose which types of quest objects to track. This option only has an effect if quest data is detected."
